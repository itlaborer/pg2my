[package]
name = "pg2mysql"
version = "0.2.0"
edition = "2024"
description = "PostgreSQL / MySQL 多方言结构与数据迁移工具（pg→pg、mysql→mysql、pg→mysql、mysql→pg）"
license = "Apache-2.0"
repository = "https://github.com/itlaborer/pg2my"
readme = "README.md"
keywords = ["postgresql", "mysql", "migration", "database", "cdc"]
categories = ["database", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
bytes = "1"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring", "binlog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = "0.7.18"
