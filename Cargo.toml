[package]
name = "pg2mysql"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
bytes = "1"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring", "binlog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-postgres = "0.7.18"
